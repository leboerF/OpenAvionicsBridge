name: Publish OpenAvionicsBridge 1.0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-1.0.1.yml'

permissions:
  contents: write

env:
  VERSION: 1.0.1
  RELEASE_COMMIT: 6a06a28cf418a07f27b5ffa91c0f178f0ee217dd

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Publish OpenAvionicsBridge 1.0.1 release')
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run unit tests
        run: go test ./...

      - name: Build Windows resources
        run: OAB_VERSION="$VERSION" python tools/build-windows-resources.py

      - name: Build Windows x64 release
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -H=windowsgui -X main.appVersion=$VERSION" \
            -o OpenAvionicsBridge.exe .
          sha256sum OpenAvionicsBridge.exe | tee OpenAvionicsBridge-1.0.1-SHA256.txt

      - name: Package release
        run: zip -9 OpenAvionicsBridge-1.0.1-win-x64.zip OpenAvionicsBridge.exe OpenAvionicsBridge-1.0.1-SHA256.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "OpenAvionicsBridge-1.0.1-win-x64.zip" \
            "OpenAvionicsBridge-1.0.1-SHA256.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "OpenAvionicsBridge 1.0.1" \
            --notes-file "RELEASE-NOTES-1.0.1.md"
