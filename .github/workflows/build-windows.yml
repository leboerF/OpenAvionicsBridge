name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 1.0.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run unit tests
        run: go test ./...

      - name: Windows compile check
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o OpenAvionicsBridge-tests.exe .

      - name: Build Windows resources
        run: OAB_VERSION="$VERSION" python tools/build-windows-resources.py

      - name: Build Windows x64 release
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -H=windowsgui -X main.appVersion=$VERSION" \
            -o OpenAvionicsBridge.exe .
          sha256sum OpenAvionicsBridge.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenAvionicsBridge-${{ env.VERSION }}-win-x64
          path: OpenAvionicsBridge.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenAvionicsBridge-${{ env.VERSION }}-win-x64
          path: dist

      - name: Package release assets
        run: |
          cd dist
          zip -9 "OpenAvionicsBridge-${VERSION}-win-x64.zip" OpenAvionicsBridge.exe
          sha256sum "OpenAvionicsBridge-${VERSION}-win-x64.zip" > "OpenAvionicsBridge-${VERSION}-SHA256.txt"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "OpenAvionicsBridge ${VERSION}" \
            --notes-file "RELEASE-NOTES-${VERSION}.md" \
            "dist/OpenAvionicsBridge-${VERSION}-win-x64.zip" \
            "dist/OpenAvionicsBridge-${VERSION}-SHA256.txt"
